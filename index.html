<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>作品集 · Unity 客户端开发</title>
  <meta name="description" content="Unity 客户端开发工程师个人作品集：自我介绍、学习记录与作品展示。">
  <meta name="theme-color" content="#002FA7">
  <meta name="color-scheme" content="light">

  <!-- 社交分享 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="作品集 · Unity 客户端开发">
  <meta property="og:description" content="Unity 客户端开发工程师个人作品集：自我介绍、学习记录与作品展示。">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23002FA7'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
</head>
<body>

  <div class="progress-bar" id="progressBar"></div>

  <!-- ============ 顶部导航 ============ -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" id="brandMark">U</span>
        <span>
          <span class="brand-text" id="brandText">作品集</span>
          <span class="brand-sub" id="brandSub">UNITY · CLIENT DEV</span>
        </span>
      </a>
      <nav class="nav" id="nav">
        <a href="#about">关于我</a>
        <a href="#learning">学习记录</a>
        <a href="#works">作品展示</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <!-- ============ 自我介绍 ============ -->
    <section class="hero" id="about">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-inner">

        <div class="editable" id="profileHero">
          <div class="hero-top">
            <div class="avatar" id="avatar"></div>
            <div class="hero-meta">
              <div class="eyebrow" id="heroRole">UNITY CLIENT DEVELOPER</div>
              <h1 class="hero-name" id="heroName">加载中…</h1>
              <p class="hero-role" id="heroRoleLine"></p>
              <p class="hero-tagline" id="heroTagline"></p>
              <div id="heroStatusWrap"></div>
            </div>
          </div>

          <div class="stats" id="stats"></div>

          <div class="hero-cols">
            <div class="prose" id="heroBio"></div>
            <div class="skill-groups" id="skillGroups"></div>
          </div>
        </div>

        <div class="add-row">
          <button class="btn btn-soft" data-edit="profile">编辑自我介绍</button>
        </div>
      </div>
    </section>

    <!-- ============ 学习记录 ============ -->
    <section class="section" id="learning">
      <div class="container">
        <div class="section-head">
          <div class="section-head-row">
            <div>
              <div class="eyebrow">LEARNING LOG</div>
              <h2 class="section-title">学习记录</h2>
              <p class="section-desc" id="learningDesc">
                把踩过的坑和想明白的事写下来，让下一次少走一点弯路。
              </p>
            </div>
            <div class="edit-tools-inline">
              <button class="btn btn-soft btn-sm" data-add="learning">＋ 新增记录</button>
            </div>
          </div>
        </div>

        <div class="filters" id="learningFilters"></div>
        <div class="timeline" id="learningList"></div>
        <div class="add-row">
          <button class="btn btn-soft" data-add="learning">＋ 新增学习记录</button>
        </div>
      </div>
    </section>

    <!-- ============ 作品展示 ============ -->
    <section class="section" id="works">
      <div class="container">
        <div class="section-head">
          <div class="section-head-row">
            <div>
              <div class="eyebrow">SELECTED WORKS</div>
              <h2 class="section-title">作品展示</h2>
              <p class="section-desc" id="worksDesc">
                做过的东西，以及每一件背后解决的问题。
              </p>
            </div>
            <div class="edit-tools-inline">
              <button class="btn btn-soft btn-sm" data-add="works">＋ 新增作品</button>
            </div>
          </div>
        </div>

        <div class="filters" id="worksFilters"></div>
        <div class="works-grid" id="worksList"></div>
        <div class="add-row">
          <button class="btn btn-soft" data-add="works">＋ 新增作品</button>
        </div>
      </div>
    </section>

  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div id="footerNote" style="color:var(--ink-2);font-weight:500;margin-bottom:4px"></div>
        <div id="footerCopy"></div>
      </div>
      <div class="footer-links" id="footerLinks"></div>
    </div>
  </footer>

  <!-- ============ 编辑模式浮动按钮 ============ -->
  <button class="admin-fab" id="adminFab" title="进入编辑模式（本地保存 / 导出 / 同步）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
    </svg>
    <span id="adminFabText">编辑</span>
  </button>

  <!-- ============ 编辑工具栏 ============ -->
  <div class="admin-bar" id="adminBar">
    <div class="admin-bar-inner">
      <span class="admin-tag">编辑模式</span>
      <button class="btn btn-ghost btn-sm" id="btnExportJs">导出 data.js</button>
      <button class="btn btn-ghost btn-sm" id="btnExportJson">导出备份 JSON</button>
      <button class="btn btn-ghost btn-sm" id="btnImport">导入数据</button>
      <button class="btn btn-ghost btn-sm" id="btnGithub">GitHub 同步</button>
      <button class="btn btn-ghost btn-sm" id="btnSettings">设置</button>
      <button class="btn btn-ghost btn-sm" id="btnReset">恢复默认</button>
      <button class="btn btn-primary btn-sm" id="btnExit">完成</button>
    </div>
  </div>

  <!-- ============ 弹层容器 ============ -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <input type="file" id="filePicker" accept=".json,.js,application/json,text/javascript" hidden>
  <input type="file" id="imagePicker" accept="image/*" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
